            </div>

            <div class="space-y-2 pt-2 border-t border-slate-800">
              <h3 class="text-xs font-bold text-slate-300">${t('activeTowerHazards')} (${qhseHazards.length})</h3>
              ${qhseHazards.map(h => `
                <div class="p-3 rounded-2xl bg-slate-900 border border-slate-800 space-y-1 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="font-mono font-bold text-sky-400">#${h.num}</span>
                    <span class="px-2 py-0.5 rounded-full text-[9px] font-black ${h.sev === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}">${h.sev}</span>
                  </div>
                  <p class="font-bold text-white text-xs">${h.desc}</p>
                  <p class="text-[10px] text-slate-400">📍 ${h.loc} · ${h.cat}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      else if (currentScreen === 'my-section') {
        container.innerHTML = `
          <div class="space-y-3.5">
            <h2 class="text-sm font-black text-white">${t('mySelfService')}</h2>

            <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-600 to-blue-500 flex items-center justify-center text-white font-black text-lg">
                AK
              </div>
              <div>
                <h3 class="font-black text-sm text-white">${currentLang === 'ar' ? 'أحمد خالد' : 'Ahmed Khaled'}</h3>
                <p class="text-xs text-sky-400 font-mono">Employee ID: TC-0234</p>
                <p class="text-[10px] text-slate-400">Apex FM LLC · Marina Pinnacle Tower Team</p>
              </div>
            </div>

            <div class="space-y-2">
              ${[
                { icon: '🏖️', title: t('annualLeave'), subtitle: currentLang === 'ar' ? 'رصيد الإجازات المتبقي: 18 يوم' : 'Available balance: 18 days' },
                { icon: '🛂', title: t('passportRelease'), subtitle: currentLang === 'ar' ? 'للسفر أو تجديد الإقامة' : 'For vacation or visa renewal' },
                { icon: '💵', title: t('payslip'), subtitle: currentLang === 'ar' ? 'كشف راتب شهر أكتوبر 2026' : 'October 2026 Salary Slip' },
                { icon: '📜', title: t('salaryCertificate'), subtitle: currentLang === 'ar' ? 'إصدار فوري معتمد رقمياً' : 'Instant digitally signed certificate' }
              ].map(item => `
                <div onclick="showToast('${currentLang === 'ar' ? 'تم فتح نموذج ' + item.title : 'Opened form for ' + item.title}')" class="p-3.5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                  <div class="flex items-center gap-3">
                    <span class="text-xl">${item.icon}</span>
                    <div>
                      <h4 class="text-xs font-bold text-white">${item.title}</h4>
                      <p class="text-[10px] text-slate-400">${item.subtitle}</p>
                    </div>
                  </div>
                  <span class="text-xs text-slate-500 font-bold">→</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function setTicketFilter(filter) {
      selectedTicketFilter = filter;
      renderCurrentScreen();
    }

    function updateTicketStage(id, newStage) {
      const wo = workOrders.find(w => w.id === id);
      if (wo) {
        wo.stage = newStage;
        showToast(currentLang === 'ar' ? `تم تحديث حالة البلاغ إلى ${newStage}` : `Updated ticket stage to ${newStage}`);
        renderCurrentScreen();
      }
    }

    function togglePpmItem(routineId, itemId) {
      const routine = ppmRoutines.find(p => p.id === routineId);
      if (routine) {
        const item = routine.checklist.find(c => c.id === itemId);
        if (item) {
          item.pass = !item.pass;
          showToast(currentLang === 'ar' ? 'تم تعديل حالة بند الفحص' : 'Updated checklist item');
          renderCurrentScreen();
        }
      }
    }

    function completePpmRoutine(routineId) {
      const routine = ppmRoutines.find(p => p.id === routineId);
      if (routine) {
        routine.status = 'CLOSED';
        showToast(currentLang === 'ar' ? 'تم اعتماد وإغلاق مهمة الصيانة بنجاح!' : 'PPM Routine officially completed and closed!');
        navigateTo('ppm');
      }
    }

    function toggleShift() {
      isCheckedIn = !isCheckedIn;
      document.getElementById('shiftStatusPillText').textContent = isCheckedIn ? i18n[currentLang].onDuty : i18n[currentLang].offDuty;
      showToast(isCheckedIn ? (currentLang === 'ar' ? 'تم تسجيل الحضور في برج مارينا بينكل' : 'Checked In at Marina Pinnacle') : (currentLang === 'ar' ? 'تم تسجيل الانصراف' : 'Checked Out'));
      renderCurrentScreen();
    }

    function attendTbt() {
      tbtAttended = true;
      showToast(currentLang === 'ar' ? 'تم تسجيل حضور حديث السلامة واجتياز الاختبار بنجاح!' : 'TBT Attendance & Safety Quiz Completed!');
      renderCurrentScreen();
    }

    function submitNewHazard() {
      const loc = document.getElementById('inputHazardLoc')?.value || 'Roof Mechanical Area';
      const sev = document.getElementById('selectHazardSev')?.value || 'HIGH';
      const desc = document.getElementById('inputHazardDesc')?.value || 'ملاحظة ميدانية تم رصدها من الفني أثناء الجولة';

      const nextNum = `HZ-26-08${qhseHazards.length + 1}`;
      qhseHazards.unshift({
        id: `hz-${Date.now()}`,
        num: nextNum,
        cat: '⚡ صيانة عامة · General',
        sev: sev,
        loc: loc,
        desc: desc,
        status: 'OPEN'
      });

      showToast(currentLang === 'ar' ? `تم إرسال بلاغ الخطر #${nextNum} لفريق السلامة!` : `Dispatched Hazard #${nextNum} to QHSE!`);
      renderCurrentScreen();
    }

    // التشغيل المبدئي للتطبيق
    renderCurrentScreen();
  </script>
</body>
</html>
