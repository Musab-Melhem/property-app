      50% { height: 18px; }

    .wave-bar-2 { animation: soundwave 0.8s infinite ease-in-out 0.2s; }

    let qhseHazards = [

      { id: 'hz-2', num: 'HZ-26-082', cat: 'Height', sev: 'HIGH', loc: 'Building BMU Cradle', desc: 'Secondary safety wire requires calibration and fall arrest anchor inspection.', status: 'OPEN' },

    ];

    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (isCheckedIn) {
        shiftSeconds++;
        const h = String(Math.floor(shiftSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((shiftSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(shiftSeconds % 60).padStart(2, '0');
        document.getElementById('shiftStatusBadge').textContent = `${h}h ${m}m`;
        const durEl = document.getElementById('liveDurationText');
        if (durEl) durEl.textContent = `${h}:${m}:${s}`;
      }
    }, 1000);

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    function navigateTo(screenId, paramId = null) {
      currentScreen = screenId;
      if (paramId) {
        if (screenId === 'ticket-details') activeTicketId = paramId;
        if (screenId === 'ppm-details') activePpmId = paramId;
      }
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('text-sky-400');
        b.classList.add('text-slate-400');
      });
      const act = document.getElementById(`nav-${screenId}`);
      if (act) {
        act.classList.remove('text-slate-400');
        act.classList.add('text-sky-400');
      }
      renderCurrentScreen();
    }

    function renderLoginScreen() {
      const c = document.getElementById('screenContainer');
      c.innerHTML = `
        <div class="flex flex-col justify-between min-h-[640px] p-2 text-white text-start">
          <div>
            <div class="flex items-center justify-between pb-3">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-[10px] font-bold text-slate-300">

    function handleStandaloneLogin() {
      const id = (document.getElementById('workerEmpIdInput')?.value || '').trim();
      const pin = (document.getElementById('workerPinInput')?.value || '').trim();
      const alertBox = document.getElementById('loginAlertBox');
      const alertMsg = document.getElementById('loginAlertMsg');

      const matched = REGISTERED_WORKERS.find(w => w.employeeId === id && w.pin === pin);
      if (!matched) {
        if (alertBox && alertMsg) {
          alertBox.classList.remove('hidden');
          alertMsg.textContent = 'Invalid Employee ID or Password. Please verify your credentials or contact your supervisor.';
        }
        return;
      }

      activeWorker = matched;
      try {
        localStorage.setItem('propertycare_worker_session', JSON.stringify(matched));
        localStorage.setItem('propertycare_worker_authenticated', 'true');
      } catch(e) {}
      showToast('Authenticated as ' + matched.name);
      currentScreen = 'home';
      renderCurrentScreen();
    }

    function logoutWorker() {
      try {
        localStorage.removeItem('propertycare_worker_session');
        localStorage.removeItem('propertycare_worker_authenticated');
      } catch(e) {}
      activeWorker = null;
      renderCurrentScreen();
      showToast('Worker Session Locked');
    }

        c.innerHTML = `
          <div class="space-y-3.5">
            <button onclick="navigateTo('home')" class="text-xs font-bold text-sky-400 hover:text-sky-300 flex items-center gap-1 cursor-pointer">
              ← Back to Home
            </button>

            <div class="p-4 rounded-3xl bg-[#0f172a] border border-[#1e293b] space-y-3 shadow-xl">
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">Session #8841</span>
                <span class="text-xs text-slate-400">Marina Pinnacle Tower</span>
              </div>

              <h2 class="text-sm font-black text-white leading-tight">
                Safe Working at Heights & Fall Arrest Harness Inspection
              </h2>

              <p class="text-xs text-slate-300 leading-relaxed">
                Mandatory pre-shift safety toolbox talk before accessing roof BMU cradles or ladder risers. Dual-lanyard shock-absorbing harness inspection is required.
              </p>

              <div class="p-3 rounded-2xl bg-[#070d1e] border border-[#1e293b] space-y-1 text-xs">
                <div class="flex justify-between">
                  <span class="text-slate-400">Safety Lead:</span>
                  <span class="font-bold text-white">Eng. Tarek Mansour (QHSE)</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">Time:</span>
                  <span class="font-bold text-white">Today · 07:45 AM</span>
                </div>
              </div>

              <button onclick="attendTbt()" class="w-full py-3 rounded-2xl ${tbtAttended ? 'bg-slate-800 text-slate-400 cursor-default' : 'bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer'} font-black text-xs shadow-lg transition">
                ${tbtAttended ? '✓ Attendance & Safety Quiz Completed' : 'Sign Attendance & Pass Quiz'}
              </button>
            </div>
          </div>
        `;
      }

      else if (currentScreen === 'hazard-report') {
        c.innerHTML = `
          <div class="space-y-3.5">
            <h2 class="text-sm font-black text-white">Report Hazard to QHSE</h2>

            <div class="p-4 rounded-3xl bg-[#0f172a] border border-[#1e293b] space-y-3 shadow-xl">
              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">📍 Property / Building</label>
                <input type="text" readonly value="Marina Pinnacle Tower (PRP-DXB-001)" class="w-full px-3 py-2 rounded-xl bg-[#070d1e] border border-[#1e293b] text-xs text-slate-300 font-mono">
              </div>

              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">🔍 Floor / Area / Room</label>
                <input id="inputHazardLoc" type="text" placeholder="e.g. Roof Chiller Plant Room" class="w-full px-3 py-2 rounded-xl bg-[#070d1e] border border-slate-700 text-xs text-white focus:outline-none focus:border-sky-500">
              </div>

              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">⚠️ Severity Level</label>
                <select id="selectHazardSev" class="w-full px-3 py-2 rounded-xl bg-[#070d1e] border border-slate-700 text-xs text-white">
                  <option value="CRITICAL">CRITICAL</option>
                  <option value="HIGH">HIGH</option>
                  <option value="MEDIUM">MEDIUM</option>
                  <option value="LOW">LOW</option>
                </select>
              </div>

              <div>
                <label class="text-[11px] font-bold text-slate-300 block mb-1">📝 Observation Description</label>
                <textarea id="inputHazardDesc" rows="2" placeholder="Describe the safety defect or observation..." class="w-full px-3 py-2 rounded-xl bg-[#070d1e] border border-slate-700 text-xs text-white resize-none"></textarea>
              </div>

              <button onclick="submitNewHazard()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-400 hover:to-rose-500 text-white font-black text-xs shadow-lg shadow-rose-600/30 cursor-pointer transition">
                Submit Hazard to QHSE Team
              </button>
            </div>

            <!-- Active Hazards List (10 Open in Marina Pinnacle) -->
            <div class="space-y-2 pt-2 border-t border-[#1e293b]">
              <h3 class="text-xs font-bold text-slate-300">Active Hazards in Marina Pinnacle (${qhseHazards.length})</h3>
              ${qhseHazards.map(h => `
                <div class="p-3 rounded-2xl bg-[#0f172a] border border-[#1e293b] space-y-1 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="font-mono font-bold text-sky-400">#${h.num}</span>
                    <span class="px-2 py-0.5 rounded-full text-[9px] font-black ${h.sev === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}">${h.sev}</span>
                  </div>
                  <p class="font-bold text-white text-xs">${h.desc}</p>
                  <p class="text-[10px] text-slate-400">📍 ${h.loc} · ${h.cat}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      else if (currentScreen === 'my-section') {
        c.innerHTML = `
          <div class="space-y-3.5">
            <h2 class="text-sm font-black text-white">Technician Self-Service</h2>

            <div class="p-4 rounded-3xl bg-[#0f172a] border border-[#1e293b] flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-600 to-blue-500 flex items-center justify-center text-white font-black text-lg">
                AK
              </div>
              <div>
                <h3 class="font-black text-sm text-white">Ahmed Khaled</h3>
                <p class="text-xs text-sky-400 font-mono">Employee ID: TC-0234</p>
                <p class="text-[10px] text-slate-400">Apex FM LLC · Marina Pinnacle Team</p>
              </div>
            </div>

            <div class="space-y-2">
              ${[
                { icon: '🏖️', title: 'Annual Leave Request', sub: 'Available balance: 18 days' },
                { icon: '🛂', title: 'Passport Release Request', sub: 'For vacation or visa renewal' },
                { icon: '💵', title: 'View Latest Payslip', sub: 'October 2026 Salary Slip' },
                { icon: '📜', title: 'Salary Certificate Request', sub: 'Digitally signed official letter' }
              ].map(item => `
                <div onclick="showToast('Opened: ' + '${item.title}')" class="p-3.5 rounded-2xl bg-[#0f172a] border border-[#1e293b] hover:border-slate-700 flex items-center justify-between cursor-pointer transition shadow-sm">
                  <div class="flex items-center gap-3">
                    <span class="text-xl">${item.icon}</span>
                    <div>
                      <h4 class="text-xs font-bold text-white">${item.title}</h4>
                      <p class="text-[10px] text-slate-400">${item.sub}</p>
                    </div>
                  </div>
                  <span class="text-xs text-slate-500 font-bold">→</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function setTicketFilter(f) {
      selectedTicketFilter = f;
      renderCurrentScreen();
    }

    function updateTicketStage(id, s) {
      const w = workOrders.find(item => item.id === id);
      if (w) {
        w.stage = s;
        showToast(`Updated ticket #${w.ticketNumber} to: ${s}`);
        renderCurrentScreen();
      }
    }

    function togglePpmItem(routineId, itemId) {
      const r = ppmRoutines.find(p => p.id === routineId);
      if (r) {
        const item = r.checklist.find(c => c.id === itemId);
        if (item) {
          item.pass = !item.pass;
          showToast('Updated checklist item status');
          renderCurrentScreen();
        }
      }
    }

    function completePpmRoutine(routineId) {
      const r = ppmRoutines.find(p => p.id === routineId);
      if (r) {
        r.status = 'CLOSED';
        showToast('PPM Routine officially completed and signed off!');
        navigateTo('ppm');
      }
    }

    function toggleShift() {
      isCheckedIn = !isCheckedIn;
      showToast(isCheckedIn ? 'Checked In at Marina Pinnacle Tower' : 'Checked Out');
      renderCurrentScreen();
    }

    function attendTbt() {
      tbtAttended = true;
      showToast('TBT Safety Quiz passed! Attendance logged.');
      renderCurrentScreen();
    }

    function submitNewHazard() {
      const loc = document.getElementById('inputHazardLoc')?.value || 'Roof Plant Room';
      const sev = document.getElementById('selectHazardSev')?.value || 'HIGH';
      const desc = document.getElementById('inputHazardDesc')?.value || 'Site observation logged during inspection patrol.';

      const nextNum = `HZ-26-08${qhseHazards.length + 1}`;
      qhseHazards.unshift({
        id: `hz-${Date.now()}`,
        num: nextNum,
        cat: 'General',
        sev: sev,
        loc: loc,
        desc: desc,
        status: 'OPEN'
      });

      showToast(`Dispatched Hazard #${nextNum} to QHSE team!`);
      renderCurrentScreen();
    }

    // Initial load in English
    renderCurrentScreen();
  </script>
</body>
</html>
